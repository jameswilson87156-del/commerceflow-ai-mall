spring:
  datasource:
    url: jdbc:h2:mem:commerceflow;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    username: sa
    password:
  flyway:
    enabled: true
  sql:
    init:
      mode: never
commerceflow:
  ai:
    rate-limit:
      enabled: false
management:
  endpoint:
    health:
      probes:
        enabled: true
      show-components: always
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,db
