spring:
  config:
    activate:
      on-profile: local

commerceflow:
  showcase:
    mode: ${SHOWCASE_MODE:LOCAL}
    data-scope: ${SHOWCASE_DATA_SCOPE:LOCAL}
    authentication-mode: ${SHOWCASE_AUTHENTICATION_MODE:NONE}
    demo-user-id: ${SHOWCASE_DEMO_USER_ID:0}
    operator-authentication-mode: ${SHOWCASE_OPERATOR_AUTHENTICATION_MODE:NONE}
    demo-operator-id: ${SHOWCASE_DEMO_OPERATOR_ID:0}
    legacy-api-enabled: ${COMMERCEFLOW_LEGACY_API_ENABLED:false}
