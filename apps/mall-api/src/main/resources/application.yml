server:
  port: ${MALL_API_PORT:8080}
spring:
  application:
    name: commerceflow-mall-api
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:${MYSQL_PORT:3307}/${MYSQL_DATABASE:commerceflow}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai}
    username: ${DB_USERNAME:${MYSQL_USER:commerceflow}}
    password: ${DB_PASSWORD:${MYSQL_PASSWORD:commerceflow_demo}}
  flyway:
    enabled: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6380}
      database: ${REDIS_DATABASE:0}
      password: ${REDIS_PASSWORD:}
      connect-timeout: ${REDIS_CONNECT_TIMEOUT:500ms}
      timeout: ${REDIS_TIMEOUT:500ms}
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-components: always
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,db
springdoc:
  swagger-ui:
    path: /swagger-ui.html
commerceflow:
  cors:
    allowed-origins: ${COMMERCEFLOW_CORS_ALLOWED_ORIGINS:${SHOWCASE_ADMIN_ORIGIN:http://127.0.0.1:5174},${SHOWCASE_MOBILE_ORIGIN:http://127.0.0.1:5173}}
  ai-service-url: ${AI_SERVICE_URL:http://127.0.0.1:8000}
  ai-connect-timeout-ms: ${AI_CONNECT_TIMEOUT_MS:1500}
  ai-read-timeout-ms: ${AI_READ_TIMEOUT_MS:3000}
  auth:
    # SHOWCASE keeps the existing local/demo adapter. OIDC is mandatory for
    # staging/production and fails closed when issuer-uri is not configured.
    mode: ${COMMERCEFLOW_AUTH_MODE:SHOWCASE}
    issuer-uri: ${COMMERCEFLOW_AUTH_ISSUER_URI:}
    audience: ${COMMERCEFLOW_AUTH_AUDIENCE:}
    roles-claim: ${COMMERCEFLOW_AUTH_ROLES_CLAIM:roles}
    principal-claim: ${COMMERCEFLOW_AUTH_PRINCIPAL_CLAIM:sub}
    username-claim: ${COMMERCEFLOW_AUTH_USERNAME_CLAIM:email}
    display-name-claim: ${COMMERCEFLOW_AUTH_DISPLAY_NAME_CLAIM:name}
    user-id-claim: ${COMMERCEFLOW_AUTH_USER_ID_CLAIM:}
    operator-id-claim: ${COMMERCEFLOW_AUTH_OPERATOR_ID_CLAIM:}
    operator-roles: ${COMMERCEFLOW_AUTH_OPERATOR_ROLES:operator,admin}
    auto-provision-users: ${COMMERCEFLOW_AUTH_AUTO_PROVISION_USERS:false}
  ai:
    provider:
      mode: ${COMMERCEFLOW_AI_PROVIDER:FASTAPI}
      base-url: ${COMMERCEFLOW_AI_BASE_URL:${AI_SERVICE_URL:http://127.0.0.1:8000}}
      model: ${COMMERCEFLOW_AI_MODEL:}
      api-key: ${COMMERCEFLOW_AI_API_KEY:}
      path: ${COMMERCEFLOW_AI_PATH:/v1/chat/completions}
      connect-timeout-ms: ${COMMERCEFLOW_AI_CONNECT_TIMEOUT_MS:1500}
      read-timeout-ms: ${COMMERCEFLOW_AI_READ_TIMEOUT_MS:8000}
      max-retries: ${COMMERCEFLOW_AI_MAX_RETRIES:1}
      fallback-enabled: ${COMMERCEFLOW_AI_FALLBACK_ENABLED:true}
      provider-name: ${COMMERCEFLOW_AI_PROVIDER_NAME:openai-compatible}
    rate-limit:
      enabled: ${AI_RATE_LIMIT_ENABLED:true}
      limit: ${AI_RATE_LIMIT_LIMIT:5}
      window-seconds: ${AI_RATE_LIMIT_WINDOW_SECONDS:60}
      key-prefix: ${AI_RATE_LIMIT_KEY_PREFIX:commerceflow:local:ai:rate:v1}
      failure-policy: ${AI_RATE_LIMIT_FAILURE_POLICY:FAIL_OPEN}
      identity-hash-secret: ${AI_RATE_LIMIT_IDENTITY_HASH_SECRET:local-showcase-rate-limit-salt}
  showcase:
    # Safe base defaults: no implicit customer/operator identity and no legacy API.
    # Local/demo startup must opt in explicitly through .env or application-demo.yml.
    mode: ${SHOWCASE_MODE:LOCAL}
    data-scope: ${SHOWCASE_DATA_SCOPE:LOCAL}
    authentication-mode: ${SHOWCASE_AUTHENTICATION_MODE:NONE}
    demo-user-id: ${SHOWCASE_DEMO_USER_ID:0}
    demo-username: ${SHOWCASE_DEMO_USERNAME:demo@commerceflow.local}
    demo-display-name: ${SHOWCASE_DEMO_DISPLAY_NAME:Demo Shopper}
    operator-authentication-mode: ${SHOWCASE_OPERATOR_AUTHENTICATION_MODE:NONE}
    demo-operator-id: ${SHOWCASE_DEMO_OPERATOR_ID:0}
    demo-operator-username: ${SHOWCASE_DEMO_OPERATOR_USERNAME:operator@commerceflow.local}
    demo-operator-display-name: ${SHOWCASE_DEMO_OPERATOR_DISPLAY_NAME:Showcase Operator}
    legacy-api-enabled: ${COMMERCEFLOW_LEGACY_API_ENABLED:false}
    mobile-runtime: ${SHOWCASE_MOBILE_RUNTIME:H5_VERIFIED}
    non-h5-runtime: ${SHOWCASE_NON_H5_RUNTIME:COMPILE_ONLY}
mybatis:
  mapper-locations: classpath:mappers/OrderEvidenceMapper.xml
