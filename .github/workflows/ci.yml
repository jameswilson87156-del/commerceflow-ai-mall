name: commerceflow-ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  repository-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/ci/verify_repository.py

  java-backend:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: commerceflow_ci
          MYSQL_USER: commerceflow
          MYSQL_PASSWORD: commerceflow_demo
          MYSQL_ROOT_PASSWORD: root_demo
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h localhost -ucommerceflow -pcommerceflow_demo"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:8.0.2
        ports:
          - 6380:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      MYSQL_PORT: 3306
      MYSQL_DATABASE: commerceflow_ci
      MYSQL_USER: commerceflow
      MYSQL_PASSWORD: commerceflow_demo
      REDIS_HOST: localhost
      REDIS_PORT: 6380
      AI_PROVIDER_MODE: MOCK
      AI_PROVIDER_API_KEY: ''
      COMMERCEFLOW_AI_PROVIDER: FASTAPI
      COMMERCEFLOW_AI_API_KEY: ''
      MALL_API_PORT: 8080
    defaults:
      run:
        working-directory: apps/mall-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Java unit and Redis integration tests
        run: mvn test
      - name: MySQL Flyway overview smoke
        shell: bash
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/commerceflow-api.log"
          mvn spring-boot:run >"$log" 2>&1 &
          api_pid=$!
          cleanup() { kill "$api_pid" 2>/dev/null || true; wait "$api_pid" 2>/dev/null || true; }
          trap cleanup EXIT
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:8080/actuator/health/readiness >/dev/null; then break; fi
            sleep 2
          done
          curl --fail --silent http://127.0.0.1:8080/actuator/health/readiness >/dev/null
          curl --fail --silent http://127.0.0.1:8080/api/operations/overview | jq -e '
            .summary.productCount == 2 and .summary.skuCount == 5 and
            .summary.createdOrderCount == 0 and .summary.createdOrderAmount == 0 and
            .summary.aiInteractionCount == 0'
          grep -Eq 'Successfully applied 11 migrations|Schema.*up to date' "$log"
        if: always()
      - name: Print API log on smoke failure
        if: failure()
        run: cat "$RUNNER_TEMP/commerceflow-api.log" || true

  python-ai-service:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/ai-service
    env:
      AI_PROVIDER_MODE: MOCK
      AI_PROVIDER_API_KEY: ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: services/ai-service/requirements.txt
      - run: pip install -r requirements.txt
      - run: pytest

  admin-web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/admin-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: apps/admin-web/package-lock.json
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npm test
      - run: npm run build

  mobile-app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: apps/mobile-app/package-lock.json
      - run: npm ci --legacy-peer-deps
      - run: npm audit --omit=dev --audit-level=high
      - run: npm test
      - run: npm run build
      - run: npm run build:uni

  staging-compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate staging Compose interpolation
        run: docker compose --env-file deploy/staging/.env.example -f deploy/staging/docker-compose.yml config -q
