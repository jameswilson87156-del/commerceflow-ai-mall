name: commerceflow-ci
on: [push, pull_request]
jobs:
  java:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: apps/mall-api}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17', cache: maven}
      - run: mvn test
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install -r services/ai-service/requirements.txt
      - run: pytest services/ai-service/tests
  admin-web:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: apps/admin-web}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '20', cache: npm, cache-dependency-path: apps/admin-web/package-lock.json}
      - run: npm ci
      - run: npm run build
  mobile-app:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: apps/mobile-app}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '20', cache: npm, cache-dependency-path: apps/mobile-app/package-lock.json}
      - run: npm ci
      - run: npm run build
      - run: npm run build:uni
